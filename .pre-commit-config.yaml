minimum_prek_version: "0.4.14"
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        # pnpm stores package-manager and application locks as separate documents.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: require-pattern
        name: commit subject
        stages: [commit-msg]
        args:
          - --multiline
          - '\A(feat|fix|docs|refactor|test|build|chore)(\([a-z0-9-]+\))?: [a-z]([^\r\n]*[^.\r\n])?$'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock consistency
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: ruff-check
        name: Python lint
        entry: uv run --locked --only-group dev ruff check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: ruff-format
        name: Python format
        entry: uv run --locked --only-group dev ruff format --check
        language: system
        types_or: [python, pyi]
      - id: backend-tests
        name: backend tests
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        files: ^(src/image_studio/|tests/(unit|integration)/|pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)
        stages: [pre-push]
      - id: frontend-lint
        name: frontend lint
        entry: pnpm --dir frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-format
        name: frontend format check
        entry: pnpm --dir frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-tests
        name: frontend unit tests
        entry: pnpm --dir frontend run test
        language: system
        pass_filenames: false
        files: ^(frontend/|\.pre-commit-config\.yaml)
        stages: [pre-push]
      - id: frontend-typecheck
        name: frontend TypeScript typecheck
        entry: pnpm --dir frontend run typecheck
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: e2e-typecheck
        name: e2e TypeScript typecheck
        entry: pnpm --dir tests/e2e run typecheck
        language: system
        pass_filenames: false
        files: ^tests/e2e/
      - id: e2e-mocked-tests
        name: mocked API browser tests
        entry: pnpm --dir tests/e2e run test
        language: system
        pass_filenames: false
        files: ^(frontend/|src/image_studio/|tests/e2e/|\.pre-commit-config\.yaml)
        stages: [pre-push]
      - id: e2e-check
        name: installed-wheel end-to-end tests
        entry: just e2e-check
        language: system
        pass_filenames: false
        files: '^(frontend/|src/|tests/e2e/|scripts/|pyproject\.toml|uv\.lock|README\.md|\.pre-commit-config\.yaml|justfile|\.github/workflows/)'
        stages: [pre-push]
