[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "image-studio"
version = "0.1.3"
description = "A local image generation interface backed by Diffusers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.41.0.dev0",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.31.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
image-studio = "image_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_studio"]

[tool.hatch.build]
artifacts = ["src/image_studio/web/static/**"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/gpu"]
addopts = "--strict-config --strict-markers -m 'not gpu'"
markers = ["gpu: requires explicitly selected NVIDIA GPU and local model weights"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "8b3c707ebd3ec4881f4190cf42931da07eaf3b65" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
