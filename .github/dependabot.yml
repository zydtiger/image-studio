version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /frontend
      - /tests/e2e
    schedule:
      interval: monthly
    groups:
      javascript:
        patterns: ['*']
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
